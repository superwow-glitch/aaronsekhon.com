<div class="day">
  <p>OB is a private circle in London,<br>
  kept in two places.</p>
  <p>It starts over coffee.<br>
  Sometimes a walk instead,<br>
  or a private view<br>
  if there&rsquo;s a good one on.</p>
  <p>Write and tell me where we met,<br>
  or who gave you the card.<br>
  <a href="mailto:aaron@aaronsekhon.com">aaron@aaronsekhon.com</a></p>
</div>
<div class="evening">
  <svg class="sun" viewBox="190 190 620 620" aria-hidden="true">

    <use href="#sun" clip-path="url(#above)" fill="#4A0E12"/>

  <p>A few times a season,<br>
